# Thin caller. Copy to the application repo as .github/workflows/deploy.yml.
# Trigger only on main. Do not add pull_request: a same-repo PR would otherwise
# be eligible for the secrets below. cancel-in-progress stays false.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rende-deploy-site
  cancel-in-progress: false

jobs:
  release:
    uses: rendeyuwei/rende-deploy/.github/workflows/deploy-project.yml@main
    with:
      project: site
      node_version: "22"
      # Uncomment after nginx serves /opt/site/current/dist. Until then the
      # server-side health_file is the gate, and this public check would hit
      # whatever still answers https://rende.fun/.
      # health_url: https://rende.fun/
    secrets:
      ECS_HOST: ${{ secrets.ECS_HOST }}
      ECS_USER: ${{ secrets.ECS_USER }}
      ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
      ECS_KNOWN_HOSTS: ${{ secrets.ECS_KNOWN_HOSTS }}

