# Not installed automatically. The live apex `location /` for rende.fun currently
# uses `root /var/www/html`. After /opt/site/current/dist exists, point that
# location at the publish directory. Do not remove the easypic, shutter, or
# recipes snippet includes above this location.

location / {
    root /opt/site/current/dist;
    try_files $uri $uri/ /index.html;
}
