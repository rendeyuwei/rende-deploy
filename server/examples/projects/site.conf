# Static site for https://rende.fun/
# nginx should use: root /opt/site/current/dist;
# Leave health_url commented until that root is live. health_file is enough
# for the receiver to prove the build produced an index. A public URL that
# still serves /var/www/html would return 200 for the old site.
root=/opt/site
repo_url=https://github.com/rendeyuwei/rende-site.git
service=none
build=npm ci --no-audit --no-fund && npm run build
publish_subdir=dist
health_file=dist/index.html
# health_url=https://rende.fun/
keep=5
min_interval=30
