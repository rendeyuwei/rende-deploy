# shutter-count, served at https://rende.fun/shutter
# PM2 app name in the repository ecosystem is shutter-count.
# Confirm `pm2 show shutter-count` before cutover. The live process must use
# cwd /opt/shutter-count/current so restart follows the symlink.
# path_extra is the Node 22 prefix observed on this ECS.
root=/opt/shutter-count
repo_url=https://github.com/rendeyuwei/shutter-count.git
service=pm2
pm2_app=shutter-count
pm2_home=/opt/shutter-count/.pm2
pm2_ecosystem=/etc/rende-deploy/pm2/shutter-count.config.cjs
path_extra=/opt/node-v22.23.2-linux-x64/bin
build=npm ci --no-audit --no-fund && npm run build && npm prune --omit=dev
# GET /shutter is a 308 to /shutter/. curl treats that as success.
health_url=http://127.0.0.1:3020/shutter/api/health
keep=5
min_interval=30
