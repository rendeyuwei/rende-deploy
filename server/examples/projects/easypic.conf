# easy-ncp-pic, served at https://rende.fun/easypic/
# Today the API is root PM2 `easypic-api` on 127.0.0.1:3010, and nginx serves
# static files from /var/www/easypic. This receiver restarts PM2 from current
# and does not copy files to /var/www. Point nginx at the release before
# expecting CSS/JS to update. See README.
root=/opt/easypic
repo_url=https://github.com/rendeyuwei/easy-ncp-pic.git
service=pm2
pm2_app=easypic-api
pm2_home=/opt/easypic/.pm2
pm2_ecosystem=/etc/rende-deploy/pm2/easypic-api.cjs
build=pnpm install --frozen-lockfile && EASYPIC_DEPLOY_PREFIX=easypic pnpm --filter @easypic/database build && EASYPIC_DEPLOY_PREFIX=easypic pnpm --filter @easypic/ncp-parser build && EASYPIC_DEPLOY_PREFIX=easypic pnpm --filter @easypic/api-server build && EASYPIC_DEPLOY_PREFIX=easypic pnpm --filter @easypic/web-app build && EASYPIC_DEPLOY_PREFIX=easypic pnpm --filter @easypic/admin-app build && pnpm --filter @easypic/database migrate
health_url=http://127.0.0.1:3010/api/health
keep=5
min_interval=30
