# easy-ncp-pic, served at https://rende.fun/easypic/ and /easypic/admin/
# Nginx aliases /easypic/ to current/packages/web-app/dist and /easypic/admin/
# to current/packages/admin-app/dist. It does not serve /var/www/easypic.
# path_extra is the Node 22 prefix on this ECS.
# pnpm -r build includes @easypic/image-engine. A per-package filter list missed it.
# migrate needs the sqlite path. The database stays outside releases/.
root=/opt/easypic
repo_url=https://github.com/rendeyuwei/easy-ncp-pic.git
service=pm2
pm2_app=easypic-api
pm2_home=/opt/easypic/.pm2
pm2_ecosystem=/etc/rende-deploy/pm2/easypic-api.config.cjs
path_extra=/opt/node-v22.23.2-linux-x64/bin
build=pnpm install --frozen-lockfile && EASYPIC_DEPLOY_PREFIX=easypic pnpm -r build && pnpm --filter @easypic/database migrate /var/lib/easypic/easypic.sqlite
health_url=http://127.0.0.1:3010/api/health
keep=5
min_interval=30
