# enamel-recipes, served at https://rende.fun/recipes
# Live tree is /opt/caiben (not /opt/recipes). Runtime user stays `caiben`.
# systemd EnvironmentFile=/opt/caiben/.env and DATA_DIR must stay outside releases.
# The unit must execute /opt/caiben/current, and sudoers must allow
# `/usr/bin/systemctl restart -- caiben` (the receiver passes --).
root=/opt/caiben
repo_url=https://github.com/rendeyuwei/enamel-recipes.git
service=systemd
unit=caiben
build=npm ci --no-audit --no-fund && npm run build
health_url=http://127.0.0.1:3030/recipes/api/health
health_body={"ok":true}
keep=5
min_interval=30
