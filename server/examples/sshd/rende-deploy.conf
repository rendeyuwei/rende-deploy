# Drop-in for the shared deploy user. Install with:
#   install -m 0644 server/examples/sshd/rende-deploy.conf /etc/ssh/sshd_config.d/rende-deploy.conf
#   sshd -t && systemctl reload ssh
# server/install.sh --sshd does that install and the config test, and does not reload.
#
# If `sshd -t` rejects AuthorizedKeysCommand or DisableForwarding, delete that
# one line and test again. The authorized_keys `restrict` prefix is still required.

Match User rende-deploy
    ForceCommand /usr/local/libexec/rende-deploy/receive-deploy.sh
    AuthorizedKeysFile /etc/ssh/authorized_keys/rende-deploy
    AuthorizedKeysCommand none
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PermitTTY no
    PermitUserRC no
    PermitUserEnvironment no
    X11Forwarding no
    AllowTcpForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    DisableForwarding yes
    PermitOpen none
